<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>X Post Embed Test - Cat Gatekeeper</title>
  <link rel="icon" href="../../assets/favicon-cat-32.png" sizes="32x32" type="image/png">
  <style>
    :root {
      --ink: #191919;
      --muted: #66615d;
      --paper: #fffaf4;
      --warm-band: #fff1e8;
      --orange: #ff6633;
      --coffee: #ffd51f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--warm-band);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(320px, 1fr);
      align-items: center;
      gap: clamp(28px, 6vw, 84px);
      width: min(100% - 40px, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(44px, 7vw, 88px) 0;
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--orange);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.4vw, 20px);
      font-weight: 650;
      line-height: 1.55;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 24px;
      padding: 0 20px;
      border-radius: 8px;
      color: var(--ink);
      background: var(--coffee);
      font-weight: 850;
      text-decoration: none;
    }

    .post-shell {
      min-height: 420px;
      padding: 12px;
      border: 1px solid rgba(25, 25, 25, 0.1);
      border-radius: 8px;
      background: var(--paper);
    }

    .status {
      min-height: 20px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      text-align: center;
    }

    .post-shell iframe {
      border-radius: 8px;
    }

    .post-shell .twitter-tweet {
      margin: 0 auto;
    }

    @media (max-width: 780px) {
      main {
        grid-template-columns: 1fr;
        align-items: start;
      }

      h1 {
        font-size: clamp(38px, 11vw, 52px);
      }

      .post-shell {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="test-title">
      <p class="kicker">X Embed Test</p>
      <h1 id="test-title">Post preview</h1>
      <p>This page is only for checking whether a single official X post embed works outside the normal site layout.</p>
      <a class="button" href="https://x.com/konekone2026/status/2048215520965709940" target="_blank" rel="noopener">Open this post</a>
    </section>

    <section class="post-shell" aria-label="Embedded X post from @konekone2026">
      <p class="status" id="x-status">Loading X widget script...</p>
      <blockquote class="twitter-tweet" data-dnt="true" data-theme="light">
        <a href="https://x.com/konekone2026/status/2048215520965709940?ref_src=twsrc%5Etfw">Post by @konekone2026</a>
      </blockquote>
    </section>
  </main>

  <script>
    window.__xWidgetLoaded = function () {
      var status = document.getElementById("x-status");
      if (status) status.textContent = "X widget script loaded. Rendering post...";
      if (window.twttr && window.twttr.widgets) {
        window.twttr.widgets.load().then(function () {
          if (status) status.textContent = "Render request completed.";
        });
      }
    };
  </script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8" onload="window.__xWidgetLoaded()" onerror="document.getElementById('x-status').textContent='X widget script failed to load.'"></script>
</body>
</html>
